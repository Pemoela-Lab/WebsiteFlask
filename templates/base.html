<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Kenza Athallah — Developer & Tech Enthusiast{% endblock %}">
    <title>{% block title %}Kenza Athallah{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <header id="navbar">
        <div class="container">
            <nav class="nav-inner">
                <a href="#hero" class="nav-logo">Kazed</a>

                <ul class="nav-links">
                    <li><a href="#about">Tentang</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#projects">Proyek</a></li>
                    <li><a href="#contact" class="nav-cta">Hubungi Saya</a></li>
                </ul>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; {{ 2025 }} Kenza Athallah. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
